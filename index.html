<style>
:root{
  --night:#0D2240;      /* liman gecesi */
  --deep:#143156;       /* derin su */
  --blue:#E85A3C;       /* logodaki neon mavi */
  --blue-soft:#F7C766;
  --foam:#FBF3E6;       /* köpük */
  --scale:#A9B8CE;      /* pul gümüşü */
  --lamp:#F2B035;       /* liman feneri */
  --serif:"Fraunces",Georgia,serif;
  --sans:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--foam);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:4px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:700;font-style:italic;margin:0;line-height:1.05;letter-spacing:-.01em}
p{margin:0}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Açılış ---------- */
.loader{position:fixed;inset:0;z-index:100;background:var(--night);display:grid;place-items:center;transition:opacity .7s var(--ease),visibility .7s}
.loader.done{opacity:0;visibility:hidden}
.loader svg{width:150px;overflow:visible}
.loader path{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s var(--ease) forwards}
.loader p{margin-top:18px;text-align:center;font-family:var(--serif);font-style:italic;color:var(--scale);font-size:18px;opacity:0;animation:fade .6s .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

/* ---------- Üst menü ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .4s,backdrop-filter .4s}
.nav.solid{background:rgba(13,34,64,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 1px rgba(232,90,60,.35)}
.logo span{font-family:var(--serif);font-size:20px}
.links{display:flex;gap:30px;font-size:14px;font-weight:600;letter-spacing:.02em}
.links a{text-decoration:none;opacity:.8}
.links a:hover{opacity:1}
.right{display:flex;align-items:center;gap:14px}
.lang{display:flex;font:700 12px var(--sans);border:1px solid rgba(251,243,230,.35);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:var(--foam);font:inherit;padding:5px 10px;border-radius:999px;cursor:pointer;opacity:.7}
.lang button[aria-pressed=true]{background:var(--foam);color:var(--night);opacity:1}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;font-size:15px;transition:transform .3s var(--ease),background .3s}
.pill:hover{background:#F07052;transform:translateY(-2px)}
.pill svg{width:18px;height:18px}
.pill.ghost{background:transparent;border:1px solid rgba(251,243,230,.45)}
.pill.ghost:hover{background:rgba(251,243,230,.08)}
@media(max-width:900px){.links{display:none}.nav .pill{display:none}}

/* ---------- Hero ---------- */
.hero{position:relative;height:100svh;min-height:620px;overflow:hidden;display:flex;align-items:flex-end}
.hero-img{position:absolute;inset:-6% 0 0 0;background:var(--deep) center/cover no-repeat;transform:scale(1.06);will-change:transform}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,34,64,.55) 0%,rgba(13,34,64,.05) 35%,rgba(13,34,64,.55) 70%,var(--night) 100%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:clamp(48px,9vh,96px)}
.hero h1{font-size:clamp(58px,12.5vw,176px);line-height:.88;font-weight:400}
.hero h1 em{display:block;font-style:italic;color:var(--blue-soft);font-size:.42em;line-height:1.2;margin-top:.25em;letter-spacing:0}
.hero-meta{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:flex-end;justify-content:space-between;margin-top:36px}
.hero-meta p{max-width:38ch;color:#E2E7F0;font-size:18px}
.cue{position:absolute;right:20px;bottom:28px;z-index:2;writing-mode:vertical-rl;font-size:12px;letter-spacing:.2em;color:var(--scale)}
.cue::after{content:"";display:block;width:1px;height:56px;margin:12px auto 0;background:linear-gradient(var(--scale),transparent)}
@media(max-width:700px){.cue{display:none}}

/* ---------- Bölümler ---------- */
section{position:relative}
.band{padding:clamp(88px,14vh,150px) 0}
.kicker{font-family:"Caveat",cursive;font-weight:700;color:var(--blue-soft);font-size:28px;margin-bottom:14px}
.h2{font-size:clamp(40px,6.4vw,84px)}
.body{color:#D9DFEA;max-width:56ch;font-size:18px}

.story{display:grid;grid-template-columns:1fr;gap:48px;align-items:center}
@media(min-width:900px){.story{grid-template-columns:5fr 6fr;gap:80px}}
.story figure{margin:0;position:relative}
.story img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:2px;background:var(--deep)}
.story figcaption{position:absolute;left:-1px;bottom:24px;background:var(--night);padding:10px 16px;font-size:13px;color:var(--scale)}
.facts{display:flex;gap:56px;margin-top:40px;flex-wrap:wrap}
.facts b{display:block;font:400 clamp(44px,6vw,64px)/1 var(--serif);color:var(--foam)}
.facts span{font-size:14px;color:var(--scale)}

/* ---------- Balık çarkı (imza bölüm) ---------- */
.catch{background:radial-gradient(120% 80% at 50% 40%,#183A66 0%,var(--night) 70%)}
.catch-intro{padding:clamp(88px,14vh,150px) 0 40px;text-align:center}
.catch-intro .body{margin:18px auto 0}
.scrolly{position:relative}
.stage{position:sticky;top:0;height:100svh;display:grid;align-items:center;overflow:hidden}
@media(max-width:959px){.stage{align-items:start;padding-top:92px}.wheel{width:min(80vw,44svh)}.info{min-height:0}.fname{font-size:clamp(40px,11vw,60px)}.fdesc{font-size:15px;margin-top:10px}.season-badge{margin-top:10px}.picker{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:0 90px 0 20px;scrollbar-width:none}.picker::-webkit-scrollbar{display:none}.picker button{flex:none}}
.stage-grid{display:grid;grid-template-columns:1fr;gap:8px;align-items:center}
@media(min-width:960px){.stage-grid{grid-template-columns:1fr minmax(420px,620px) 1fr;gap:32px}}

.wheel{position:relative;width:min(88vw,620px);aspect-ratio:1;margin-inline:auto}
.wheel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{transform-origin:300px 300px;transition:transform 1.2s var(--ease)}
.month{font:700 13px var(--sans);letter-spacing:.14em;fill:var(--scale);text-anchor:middle;transition:fill .6s}
.month.on{fill:var(--foam)}
.month.now{fill:var(--lamp)}
.arc-base{fill:none;stroke:rgba(169,184,206,.18);stroke-width:2}
.arc-season{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(232,90,60,.7))}
.arc-season.grow{animation:draw 1s var(--ease) forwards}
.tick{stroke:rgba(169,184,206,.35);stroke-width:1}
.now-dot{fill:var(--lamp)}
.fish{position:absolute;inset:22%;display:grid;place-items:center}
.fish svg{position:static;width:100%;height:auto;overflow:visible}
.fish .ln{fill:none;stroke:var(--blue);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(232,90,60,.55))}
.fish .acc{stroke:var(--lamp)}
.fish .dot{fill:var(--blue)}
.fish .draw .ln{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.3s var(--ease) forwards}
.fish .draw .dot{opacity:0;animation:fade .5s .7s forwards}

.info{text-align:center;min-height:250px}
@media(min-width:960px){.info{text-align:left;min-height:0}}
.counter{font:600 13px var(--sans);letter-spacing:.12em;color:var(--scale)}
.fname{font-size:clamp(46px,6vw,88px);margin:8px 0 6px}
.fname-en{font-family:var(--serif);font-style:italic;color:var(--scale);font-size:18px}
.season-badge{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid rgba(242,176,53,.5);color:var(--lamp)}
.season-badge[hidden]{display:none}
.season-badge i{width:7px;height:7px;border-radius:50%;background:var(--lamp);box-shadow:0 0 10px var(--lamp)}
.fdesc{color:#D9DFEA;margin-top:18px;max-width:34ch;font-size:17px}
@media(max-width:959px){.fdesc{margin-inline:auto}}
.facts2{display:grid;gap:18px;margin-top:6px}
.facts2 dt{font-size:13px;color:var(--scale)}
.facts2 dd{margin:2px 0 0;font-family:var(--serif);font-size:24px}
@media(max-width:959px){.side-r{display:none}}
.picker{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.picker button{background:none;border:1px solid rgba(169,184,206,.35);color:var(--scale);font:600 13px var(--sans);padding:7px 13px;border-radius:999px;cursor:pointer;transition:all .3s}
.picker button[aria-current=true]{border-color:var(--blue);color:var(--foam);background:rgba(232,90,60,.15)}
@media(min-width:960px){.picker{position:absolute;left:0;right:0;bottom:32px}}
.catch-note{text-align:center;color:var(--scale);font-size:14px;padding:24px 20px 100px}

/* ---------- Mezeler ---------- */
.meze-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.strip{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 max(20px,calc((100vw - 1180px)/2)) 24px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(220px,26vw,320px);scroll-snap-align:start;margin:0}
.card img{aspect-ratio:3/4;object-fit:cover;width:100%;border-radius:2px;background:var(--deep);transition:transform .8s var(--ease)}
.card:hover img{transform:scale(1.03)}
.card figcaption{margin-top:14px;font-family:var(--serif);font-size:22px}
.arrows{display:flex;gap:10px}
.arrows button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(251,243,230,.3);background:none;color:var(--foam);cursor:pointer;font-size:18px}

/* ---------- Alıntı ---------- */
.quote{position:relative;min-height:90svh;display:grid;place-items:center;text-align:center;overflow:hidden}
.quote .bg{position:absolute;inset:0;background:var(--deep) center/cover no-repeat;background-attachment:fixed}
@supports (-webkit-touch-callout:none){.quote .bg{background-attachment:scroll}}
.quote::after{content:"";position:absolute;inset:0;background:rgba(13,34,64,.62)}
.quote blockquote{position:relative;z-index:1;margin:0;padding:0 24px;font:italic 400 clamp(32px,5vw,64px)/1.15 var(--serif);max-width:20ch}

/* ---------- Rezervasyon ---------- */
.res{display:grid;gap:56px}
@media(min-width:900px){.res{grid-template-columns:1.2fr 1fr;gap:80px;align-items:start}}
.res .h2{max-width:12ch}
.ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px}
.info-list{display:grid;gap:28px;border-top:1px solid rgba(169,184,206,.2);padding-top:28px}
.info-list h3{font:700 13px var(--sans);color:var(--scale);margin-bottom:6px;letter-spacing:.02em}
.info-list p,.info-list a{font-family:var(--serif);font-size:24px;line-height:1.3;text-decoration:none}
.info-list a:hover{color:var(--blue-soft)}
.map{margin-top:64px;border-radius:2px;overflow:hidden;filter:grayscale(1) invert(.92) hue-rotate(180deg) contrast(.9)}
.map iframe{display:block;width:100%;height:360px;border:0}

footer{border-top:1px solid rgba(169,184,206,.15);padding:32px 0 110px;color:var(--scale);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(min-width:900px){footer{padding-bottom:32px}}

/* WhatsApp sabit buton */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;width:60px;height:60px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.fab:hover{transform:scale(1.06)}
.fab svg{width:30px;height:30px;fill:#fff}

/* Görünür olunca beliren öğeler */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
  .quote .bg{background-attachment:scroll}
}
@media(max-width:959px){.picker{flex-wrap:nowrap;justify-content:flex-start}}
.mini{display:none;color:var(--blue-soft);font-size:14px;font-weight:600;margin-top:8px}
@media(max-width:959px){.mini{display:block}}
</style>
</head>

/* ---- Çizim yardımcıları ---- */
function fishPaths(p){
  const cy=120, nose=345, tail=nose-p.L, d=p.d, tb=p.tb, T=p.T;
  const out=[];
  out.push({c:"ln",d:`M${nose} ${cy} C${nose-30} ${cy-d*1.02} ${tail+p.L*.42} ${cy-d*1.06} ${tail} ${cy-tb} M${nose} ${cy} C${nose-26} ${cy+d*.92} ${tail+p.L*.42} ${cy+d*.96} ${tail} ${cy+tb}`});
  out.push({c:"ln",d:`M${tail} ${cy-tb} C${tail-14} ${cy-tb-6} ${tail-30} ${cy-T} ${tail-44} ${cy-T-4} C${tail-34} ${cy-8} ${tail-34} ${cy+8} ${tail-44} ${cy+T+4} C${tail-30} ${cy+T} ${tail-14} ${cy+tb+6} ${tail} ${cy+tb}`});
  const ex=nose-38, ey=cy-d*.22;
  out.push({c:"ln",d:`M${ex+5} ${ey} a5 5 0 1 0 -10 0 a5 5 0 1 0 10 0`});
  out.push({c:"ln",d:`M${nose-62} ${cy-d*.62} Q${nose-74} ${cy} ${nose-60} ${cy+d*.6}`});
  out.push({c:"ln",d:`M${nose-58} ${cy+d*.05} q-18 18 -30 14`});
  const top=(x)=>cy-d*1.0+Math.pow((x-(tail+p.L*.5))/(p.L*.5),2)*d*.55;
  if(p.fin==="double"){
    let x0=nose-p.L*.34, s=`M${x0} ${top(x0)}`; for(let i=1;i<=5;i++){const x=x0-i*10; s+=` L${x+5} ${top(x)-16} L${x} ${top(x)}`}
    out.push({c:"ln",d:s});
    const x1=nose-p.L*.62; out.push({c:"ln",d:`M${x1} ${top(x1)} q-12 -18 -34 -6`});
  } else if(p.fin==="long"){
    const x0=nose-p.L*.3, x1=nose-p.L*.78; out.push({c:"ln",d:`M${x0} ${top(x0)} C${x0-20} ${top(x0)-22} ${x1+30} ${top(x1)-24} ${x1} ${top(x1)}`});
  } else {
    const x0=nose-p.L*.45; out.push({c:"ln",d:`M${x0} ${top(x0)} l-14 -16 l-12 14`});
  }
  const bx=nose-p.L*.62; out.push({c:"ln",d:`M${bx} ${cy+d*.78} q-10 14 -26 10`});
  out.push({c:"ln",d:`M${nose-70} ${cy-d*.12} C${nose-p.L*.45} ${cy-d*.28} ${tail+40} ${cy-d*.18} ${tail+6} ${cy-3}`, dash:true});
  if(p.band) out.push({c:"ln acc",d:`M${nose-52} ${cy-d*.58} q14 -2 18 10`});
  if(p.barbels){out.push({c:"ln",d:`M${nose-12} ${cy+8} q-4 18 -14 24`});out.push({c:"ln",d:`M${nose-6} ${cy+6} q0 16 -6 22`});}
  if(p.bigmouth) out.push({c:"ln",d:`M${nose} ${cy} l-30 6`});
  const dots=[];
  if(p.dots) for(let i=0;i<6;i++) dots.push([nose-90-i*24, cy-d*.35+ (i%2)*3, 3.2]);
  if(p.spots) [[120,-18],[90,10],[150,14],[180,-10],[60,-14],[110,30],[200,22]].forEach(([dx,dy])=>dots.push([nose-dx-30, cy+dy*.9, 4]));
  return {paths:out,dots};
}
function squidPaths(){
  const o=[];
  o.push({c:"ln",d:"M120 120 C150 92 250 96 330 112 C345 116 352 120 352 120 C352 120 345 124 330 128 C250 144 150 148 120 120"});
  o.push({c:"ln",d:"M300 106 C318 84 338 82 352 120 C338 158 318 156 300 134"});
  o.push({c:"ln",d:"M121 113 a5 5 0 1 0 -1 0"});
  o.push({c:"ln",d:"M120 112 C90 100 70 92 40 96 M120 116 C95 112 70 110 30 116 M120 120 C92 122 70 128 36 136 M120 125 C96 134 76 146 52 152 M118 108 C100 92 80 80 58 76"});
  o.push({c:"ln",d:"M200 108 L280 112 M200 132 L280 128",dash:true});
  return {paths:o,dots:[[230,120,3],[255,120,3],[205,120,3]]};
}
function renderFish(svg,f,animate){
  const {paths,dots}= f.kind==="squid"?squidPaths():fishPaths(f.p);
  svg.innerHTML="";
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  if(animate&&!RM) g.classList.add("draw");
  paths.forEach(pp=>{const el=document.createElementNS(g.namespaceURI,"path");el.setAttribute("d",pp.d);el.setAttribute("class",pp.c);if(pp.dash)el.setAttribute("stroke-dasharray","2 9");g.appendChild(el)});
  dots.forEach(([x,y,r])=>{const c=document.createElementNS(g.namespaceURI,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r);c.setAttribute("class","dot");g.appendChild(c)});
  svg.appendChild(g);
  if(animate&&!RM) g.querySelectorAll("path").forEach(el=>{if(!el.getAttribute("stroke-dasharray")){const L=Math.ceil(el.getTotalLength());el.style.setProperty("--l",L)} else {el.style.animation="fade .6s .5s forwards";el.style.opacity=0}});
}

const ring=document.getElementById("ring"), arc=document.getElementById("arc"), monthsG=document.getElementById("months"), ticksG=document.getElementById("ticks");
const R=236, C=2*Math.PI*R, NOW=new Date().getMonth();
for(let i=0;i<12;i++){
  const a=(i*30-90)*Math.PI/180;
  const t=document.createElementNS("http://www.w3.org/2000/svg","line");
  t.setAttribute("x1",300+Math.cos(a)*(R-10));t.setAttribute("y1",300+Math.sin(a)*(R-10));
  t.setAttribute("x2",300+Math.cos(a)*(R+10));t.setAttribute("y2",300+Math.sin(a)*(R+10));t.setAttribute("class","tick");ticksG.appendChild(t);

function buildMonths(){
  monthsG.innerHTML="";
  for(let i=0;i<12;i++){
    const a=((i+.5)*30-90)*Math.PI/180;
    const tx=document.createElementNS("http://www.w3.org/2000/svg","text");
    const x=300+Math.cos(a)*(R+34), y=300+Math.sin(a)*(R+34)+5;
    tx.setAttribute("x",x);tx.setAttribute("y",y);tx.setAttribute("class","month"+(i===NOW?" now":""));
    tx.setAttribute("transform",`rotate(${(i+.5)*30} ${x} ${y-5})`);
    tx.dataset.i=i; tx.textContent=MONTHS[lang][i]; monthsG.appendChild(tx);
  }
  const na=((NOW+.5)*30-90)*Math.PI/180, dot=document.getElementById("nowDot");
  dot.setAttribute("cx",300+Math.cos(na)*R); dot.setAttribute("cy",300+Math.sin(na)*R);
}
const inSeason=(f,m)=> f.start<=f.end ? (m>=f.start&&m<=f.end) : (m>=f.start||m<=f.end);

let current=-1;
const els={name:fName,latin:fLatin,desc:fDesc,season:fSeason,cook:fCook,pair:fPair,count:fCount,now:fNow};
function showFish(i,animate=true){
  if(i<0) i=0;
  const f=FISH[i], t=f[lang];
  const changed=i!==current; current=i;
  els.name.textContent=t.n; els.latin.textContent=f.latin; els.desc.textContent=t.d;
  els.cook.textContent=t.c; els.pair.textContent=t.y;
  els.season.textContent=`${MONTH_FULL[lang][f.start]} – ${MONTH_FULL[lang][f.end]}`;
  document.getElementById('fMini').textContent=`${MONTH_FULL[lang][f.start]} – ${MONTH_FULL[lang][f.end]} · ${t.c}`;
  els.count.textContent=`${i+1} / ${FISH.length}`;
  els.now.hidden=!inSeason(f,NOW);
  const len=((f.end-f.start+12)%12+1)*30;
  const a0=(f.start*30-90)*Math.PI/180, a1=((f.start*30+len)-90)*Math.PI/180;
  arc.setAttribute("d",`M${300+Math.cos(a0)*R} ${300+Math.sin(a0)*R} A${R} ${R} 0 ${len>180?1:0} 1 ${300+Math.cos(a1)*R} ${300+Math.sin(a1)*R}`);
  if(changed&&animate&&!RM){const L=Math.ceil(arc.getTotalLength());arc.style.setProperty("--len",L);arc.style.strokeDasharray=L;arc.classList.remove("grow");void arc.getBBox();arc.classList.add("grow")} else {arc.classList.remove("grow");arc.style.strokeDasharray="none"}
  monthsG.querySelectorAll(".month").forEach(m=>m.classList.toggle("on",inSeason(f,+m.dataset.i)));
  if(!RM){const mid=f.start*30+len/2; ring.style.transform=`rotate(${-mid}deg)`; }
  if(changed||!animate) renderFish(fishSvg,f,changed&&animate);
  picker.querySelectorAll("button").forEach((b,j)=>b.setAttribute("aria-current",j===i));
}
const scrolly=document.getElementById("scrolly"), picker=document.getElementById("picker");
function buildPicker(){
  picker.innerHTML="";
  FISH.forEach((f,i)=>{const b=document.createElement("button");b.type="button";b.textContent=f[lang].n;b.setAttribute("aria-current",i===current);
    b.addEventListener("click",()=>{const top=scrolly.getBoundingClientRect().top+scrollY;const span=scrolly.offsetHeight-innerHeight;scrollTo({top:top+span*(i+.5)/FISH.length,behavior:RM?"auto":"smooth"})});
    picker.appendChild(b)});
}
scrolly.style.height=`${FISH.length*80+20}svh`;
function updateScrolly(){
  const r=scrolly.getBoundingClientRect();
  if(r.bottom<0||r.top>innerHeight) return;
  const p=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)));
  const i=Math.min(FISH.length-1,Math.floor(p*FISH.length));
  if(i!==current) showFish(i,true);
}

const step=()=>Math.min(strip.clientWidth*.8,700);
prev.onclick=()=>strip.scrollBy({left:-step(),behavior:"smooth"});
next.onclick=()=>strip.scrollBy({left:step(),behavior:"smooth"});

/* ---- Beliren öğeler ---- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));

/* ---- Başlat ---- */
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
let saved=null; try{saved=localStorage.getItem("sandal-lang")}catch(e){}
const initial=saved||((navigator.language||"tr").toLowerCase().startsWith("tr")?"tr":"en");
current=0; setLang(initial); showFish(0,false); onScroll();
})();
</script>
</body>
</html>
